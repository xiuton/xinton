[package]
name = "xiuton"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6.3", features = ["web"] }
dioxus-web = "0.6.3"
dioxus-router = "0.6.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
gloo-timers = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
wasm-logger = "0.2"

[dev-dependencies]
wasm-pack = "0.12"

[lib]
crate-type = ["cdylib", "rlib"]